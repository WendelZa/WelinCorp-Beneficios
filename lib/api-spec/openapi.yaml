openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: proposals
    description: Solicitações comerciais
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /proposals:
    post:
      operationId: submitProposal
      tags: [proposals]
      summary: Registrar solicitação de proposta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalSubmissionInput"
      responses:
        "201":
          description: Solicitação registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalSubmissionResult"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Muitas solicitações em pouco tempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProposalSubmissionInput:
      type: object
      required:
        - companyName
        - contactName
        - email
        - phone
        - employeeCount
        - message
      properties:
        companyName:
          type: string
          minLength: 2
          maxLength: 180
        cnpj:
          type: string
          maxLength: 18
        contactName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 10
          maxLength: 20
        employeeCount:
          type: string
          enum:
            - Até 10
            - 11 a 50
            - 51 a 200
            - Mais de 200
        message:
          type: string
          minLength: 2
          maxLength: 2000
    ProposalSubmissionResult:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string

